[project]
name = "agentic"
version = "0.1.0"
description = "A minimal, well-documented framework for building LLM-powered agents"
readme = "README.md"
authors = [
    { name = "m-t-chang", email = "michaeltgchang@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "celery[redis,sqlalchemy]>=5.5.3",
    "flask>=3.1.2",
    "sqlalchemy>=2.0.0",
    "PyMuPDF>=1.24.0",
    "pypandoc>=1.13",
    "pdfplumber>=0.11.0",
    "litellm>=1.0.0",
    "mistralai>=1.0.0",  # Still needed by PDF extractor
    "tiktoken>=0.7.0",
    "pgvector>=0.3.0",
    "boto3>=1.35.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "langchain-text-splitters>=1.1.0",
    "pyyaml>=6.0.0",
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "seaborn>=0.13.0",
    "scikit-learn>=1.4.0",
    "matplotlib>=3.8.0",
    "Pillow>=10.0.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "python-dateutil>=2.8.0",
    "markitdown[xlsx,xls]>=0.1.0",
    "opendataloader-pdf>=2.2.0",
]

[project.optional-dependencies]
rerankers = [
    "zeroentropy>=0.1.0a1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
