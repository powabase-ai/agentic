[project]
name = "powabase-agentic"
version = "0.1.0"
description = "The agent, knowledge, orchestration, and workflow engine behind the Powabase stack — a Python library you can also import on its own"
readme = "README.md"
authors = [
    { name = "Powabase AI" }
]
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    "PyMuPDF>=1.24.0",
    "pdfplumber>=0.11.0",
    "litellm>=1.90.1",  # >=1.90.1 maps reasoning_effort->adaptive thinking for Opus 4.7/4.8; 1.83.14 sent the deprecated thinking.enabled (400s) and lacked opus-4-8 in its cost map (silently dropped reasoning -> thinking off -> reasoning leaked into content)
    "mistralai>=1.0.0",  # Still needed by PDF extractor
    "tiktoken>=0.7.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "langchain-text-splitters>=1.1.0",
    "pyyaml>=6.0.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "markitdown[xlsx,xls]>=0.1.0",
    "opendataloader-pdf>=2.2.0",
    # --- Sandbox contract (do NOT remove) -----------------------------------
    # These data-science libraries are imported by USER-written code at runtime
    # through the workflow FunctionBlock / copilot code-execution sandbox
    # (src/agentic/workflow/blocks/function.py IMPORT_REGISTRY; copilot advertises
    # them "Pre-installed"). They are NOT imported by agentic/src. Dropping one
    # breaks user FunctionBlock/copilot code with ImportError.
    # Guarded by tests/unit/test_sandbox_contract.py.
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "scipy>=1.12.0",
    "seaborn>=0.13.0",
    "scikit-learn>=1.4.0",
    "matplotlib>=3.8.0",
    "Pillow>=10.0.0",
    "python-dateutil>=2.8.0",
]

[project.optional-dependencies]
rerankers = [
    "zeroentropy>=0.1.0a1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Distribution is `powabase-agentic`; the import module stays `agentic`
# (like scikit-learn → import sklearn). Without this explicit mapping,
# hatchling would derive the package dir from the name and look for
# `src/powabase_agentic` — building an empty wheel.
[tool.hatch.build.targets.wheel]
packages = ["src/agentic"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "TID",    # flake8-tidy-imports (enforces billing-agnostic invariant)
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"agentic_billing_service".msg = "agentic/ must stay billing-agnostic. Use contextvars/callbacks instead."
"agentic_project_service.billing".msg = "agentic/ must stay billing-agnostic."
"agentic_control_plane".msg = "agentic/ must stay control-plane-agnostic."

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
