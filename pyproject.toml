[project]
name = "agentic"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "m-t-chang", email = "michaeltgchang@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "celery[redis,sqlalchemy]>=5.5.3",
    "flask>=3.1.2",
    "sqlalchemy>=2.0.0",
    "PyMuPDF>=1.24.0",
    "pypandoc>=1.13",
    "pdfplumber>=0.11.0",
    "litellm>=1.0.0",
    "mistralai>=1.0.0",  # Still needed by PDF extractor
    "tiktoken>=0.7.0",
    "langchain-text-splitters>=0.3.0",
    "pgvector>=0.3.0",
    "boto3>=1.35.0",
    "pydantic>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
